name: Build desktop Windows package

on:
  workflow_dispatch:
  push:
    branches:
      - 'dev-tweaks'
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: write

jobs:
  build-desktop-windows:
    name: Build desktop Windows package
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: microsoft
          cache: gradle

      - name: Update build product flavor
        run: |
          echo "isFullBuild=false" >> ./gradle.properties

      - name: Update Last.fm secrets
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          echo "LASTFM_API_KEY=${LASTFM_API_KEY}" >> ./local.properties
          echo "LASTFM_SECRET=${LASTFM_SECRET}" >> ./local.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Cache mpv-natives
        uses: actions/cache@v4
        with:
          path: mpv-natives
          key: mpv-natives-${{ hashFiles('composeApp/build.gradle.kts') }}

      - name: Populate Windows mpv natives
        run: ./gradlew :composeApp:mpvSetupAll --no-configuration-cache

      - name: Generate Conveyor config
        run: ./gradlew :desktopApp:writeConveyorConfig --no-configuration-cache

      - name: Run Conveyor (Windows only)
        uses: hydraulic-software/conveyor/actions/build@v22.0
        with:
          command: '-Kapp.machines=windows.amd64 make site'
          agree_to_license: 1
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}

      - name: Bundle Windows offline installer
        run: |
          set -euo pipefail
          test -f output/simpmusic.crt
          msix=$(ls output/simpmusic-*.x64.msix 2>/dev/null | head -1)
          test -n "$msix"
          mkdir -p installers
          stage="$(mktemp -d)"
          cp scripts/windows/install.bat output/simpmusic.crt "$msix" "$stage/"
          (
            cd "$stage"
            zip -q -j "${GITHUB_WORKSPACE}/installers/SimpMusic-Windows-installer.zip" \
              install.bat simpmusic.crt "$(basename "$msix")"
          )
          rm -rf "$stage"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: installers/SimpMusic-Windows-installer.zip
