name: Build desktop packages (FOSS)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop-packages:
    name: Build desktop packages (Linux + Windows)
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: microsoft
          cache: gradle

      - name: Install Linux packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Update build product flavor
        run: |
          echo "isFullBuild=false" >> ./gradle.properties

      - name: Update Last.fm secrets
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          echo "LASTFM_API_KEY=${LASTFM_API_KEY}" >> ./local.properties
          echo "LASTFM_SECRET=${LASTFM_SECRET}" >> ./local.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Cache mpv-natives
        uses: actions/cache@v4
        with:
          path: mpv-natives
          key: mpv-natives-${{ hashFiles('composeApp/build.gradle.kts') }}

      - name: Populate desktop mpv natives
        run: ./gradlew :composeApp:mpvSetupAll --no-configuration-cache

      - name: Generate Conveyor config
        run: ./gradlew :desktopApp:writeConveyorConfig --no-configuration-cache

      - name: Run Conveyor (Linux app tree)
        uses: hydraulic-software/conveyor/actions/build@v22.0
        with:
          command: '-Kapp.machines=linux.amd64.glibc make linux-app'
          agree_to_license: 1
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}

      - name: Wrap Linux app tree as AppImage
        run: ./gradlew :desktopApp:packageConveyorAppImage --no-configuration-cache

      - name: Run Conveyor (Windows only)
        uses: hydraulic-software/conveyor/actions/build@v22.0
        with:
          command: '-Kapp.machines=windows.amd64 make site'
          agree_to_license: 1
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}

      - name: Stage Linux AppImage
        run: |
          mkdir -p installers
          cp desktopApp/build/appimage/conveyor/SimpMusic-*.AppImage \
            installers/SimpMusic-Linux-x86_64.AppImage

      - name: Bundle Windows offline installer
        run: |
          set -euo pipefail
          test -f output/simpmusic.crt
          msix=$(ls output/simpmusic-*.x64.msix 2>/dev/null | head -1)
          test -n "$msix"
          mkdir -p installers
          stage="$(mktemp -d)"
          cp scripts/windows/install.bat output/simpmusic.crt "$msix" "$stage/"
          (
            cd "$stage"
            zip -q -j "${GITHUB_WORKSPACE}/installers/SimpMusic-Windows-installer.zip" \
              install.bat simpmusic.crt "$(basename "$msix")"
          )
          rm -rf "$stage"

      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installers
          path: installers/*
