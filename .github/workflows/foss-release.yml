name: Publish FOSS release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new tag to publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  build-android:
    name: Build FOSS Android arm64
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: microsoft
          cache: gradle

      - name: Configure FOSS signing
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          echo "$BASE_64_SIGNING_KEY" | base64 --decode > simpmusic.jks
          echo "LASTFM_API_KEY=$LASTFM_API_KEY" >> local.properties
          echo "LASTFM_SECRET=$LASTFM_SECRET" >> local.properties
          echo "isFullBuild=false" >> gradle.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Build and sign FOSS APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./build_and_sign_apk.sh --release --foss

      - name: Prepare Android release asset
        run: |
          shopt -s nullglob
          apks=(androidApp/build/outputs/apk/release/SimpMusic-foss-*.apk)
          test "${#apks[@]}" -eq 1
          mkdir -p release-assets
          cp "${apks[0]}" release-assets/SimpMusic-foss-arm64.apk

      - name: Upload Android release asset
        uses: actions/upload-artifact@v4
        with:
          name: android-installer
          path: release-assets/SimpMusic-foss-arm64.apk

  build-desktop:
    name: Build FOSS Linux and Windows installers
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: microsoft
          cache: gradle

      - name: Install Linux packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Configure FOSS desktop build
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          echo "isFullBuild=false" >> gradle.properties
          echo "LASTFM_API_KEY=$LASTFM_API_KEY" >> local.properties
          echo "LASTFM_SECRET=$LASTFM_SECRET" >> local.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Cache mpv natives
        uses: actions/cache@v4
        with:
          path: mpv-natives
          key: mpv-natives-${{ hashFiles('composeApp/build.gradle.kts') }}

      - name: Populate desktop mpv natives
        run: ./gradlew :composeApp:mpvSetupAll --no-configuration-cache

      - name: Generate Conveyor config
        run: ./gradlew :desktopApp:writeConveyorConfig --no-configuration-cache

      - name: Run Conveyor (Linux app tree)
        uses: hydraulic-software/conveyor/actions/build@v22.0
        with:
          command: '-Kapp.machines=linux.amd64.glibc make linux-app'
          agree_to_license: 1
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}

      - name: Wrap Linux app tree as AppImage
        run: ./gradlew :desktopApp:packageConveyorAppImage --no-configuration-cache

      - name: Run Conveyor (Windows only)
        uses: hydraulic-software/conveyor/actions/build@v22.0
        with:
          command: '-Kapp.machines=windows.amd64 make site'
          agree_to_license: 1
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}

      - name: Prepare desktop release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp desktopApp/build/appimage/conveyor/SimpMusic-*.AppImage \
            release-assets/SimpMusic-Linux-x86_64.AppImage
          test -f output/simpmusic.crt
          msix=$(ls output/simpmusic-*.x64.msix 2>/dev/null | head -1)
          test -n "$msix"
          stage=$(mktemp -d)
          cp scripts/windows/install.bat output/simpmusic.crt "$msix" "$stage/"
          (
            cd "$stage"
            zip -q -j "$GITHUB_WORKSPACE/release-assets/SimpMusic-Windows-installer.zip" \
              install.bat simpmusic.crt "$(basename "$msix")"
          )
          rm -rf "$stage"

      - name: Upload desktop release assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installers
          path: release-assets/*

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-desktop]
    steps:
      - name: Download Android asset
        uses: actions/download-artifact@v4
        with:
          name: android-installer
          path: release-assets

      - name: Download desktop assets
        uses: actions/download-artifact@v4
        with:
          name: desktop-installers
          path: release-assets

      - name: Verify release assets
        run: |
          set -euo pipefail
          test -f release-assets/SimpMusic-foss-arm64.apk
          test -f release-assets/SimpMusic-Linux-x86_64.AppImage
          test -f release-assets/SimpMusic-Windows-installer.zip
          ls -lh release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "SimpMusic ${RELEASE_TAG#v}" \
              --generate-notes
          fi
